<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
    <defs>
        <linearGradient id="accentGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#6366f1" />
            <stop offset="100%" stop-color="#8b5cf6" />
        </linearGradient>
        <linearGradient id="cardGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#343434" />
            <stop offset="100%" stop-color="#242424" />
        </linearGradient>
    </defs>

    <!-- Скругленная основа (squircle) -->
    <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#cardGrad)" stroke="url(#accentGrad)" stroke-width="2.5" />

    <!-- Верхний пункт: акцентный круг + строка -->
    <circle cx="20" cy="22" r="4.5" fill="url(#accentGrad)" />
    <rect x="29" y="19.5" width="19" height="5" rx="2.5" fill="#e4e4e7" />

    <!-- Нижний пункт: бейдж с галочкой + строка -->
    <rect x="14.5" y="34.5" width="11" height="11" rx="3.5" fill="url(#accentGrad)" />
    <path d="M17.5 40.2L19.3 42L22.8 38.2" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="29" y="37.5" width="15" height="5" rx="2.5" fill="#a1a1aa" />
</svg>